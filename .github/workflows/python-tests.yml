# Reusable workflow: lint, type-check and fast pytest suite for Python repos.
# Called from each repo's .github/workflows/tests.yml (see README.md).
name: python-tests

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to test with
        type: string
        default: "3.12"
      package:
        description: Source package/folder for mypy ("." for script-style repos)
        type: string
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ] && grep -q '^\[project\]' pyproject.toml; then
            pip install -e ".[dev]" || pip install -e . \
              || echo "::warning::not installable as a package; testing from the source tree"
          fi
          pip install pytest pytest-cov pytest-xdist pytest-mock hypothesis pytest-regressions "ruff==0.14.14" mypy

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy, non-blocking)
        continue-on-error: true
        run: mypy ${{ inputs.package }}

      - name: Fast test suite
        run: pytest -m "not network" -n auto
