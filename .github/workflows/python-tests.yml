# Reusable workflow: lint, type-check and fast pytest suite for Python repos.
# Called from each repo's .github/workflows/tests.yml (see README.md).
# A repo with uv.lock at its root is tested from that lock (uv path); every other repo takes the
# unchanged pip path.
name: python-tests

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to test with (pip path; the uv path uses the repo's .python-version)
        type: string
        default: "3.12"
      package:
        description: Source package/folder for mypy ("." for script-style repos)
        type: string
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # ---- uv path: repos with uv.lock ----
      - if: hashFiles('uv.lock') != ''
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (uv)
        if: hashFiles('uv.lock') != ''
        run: uv sync --locked --all-extras --all-groups

      - name: Lint (ruff, uv)
        if: hashFiles('uv.lock') != ''
        run: uvx ruff@0.14.14 check .

      - name: Type check (mypy, non-blocking, uv)
        if: hashFiles('uv.lock') != ''
        continue-on-error: true
        run: uv run --locked --with mypy mypy ${{ inputs.package }}

      - name: Fast test suite (uv)
        if: hashFiles('uv.lock') != ''
        run: uv run --locked python -m pytest -m "not network" -n auto

      # ---- pip path: everything else, unchanged ----
      - if: hashFiles('uv.lock') == ''
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        if: hashFiles('uv.lock') == ''
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ] && grep -q '^\[project\]' pyproject.toml; then
            pip install -e ".[dev]" || pip install -e . \
              || echo "::warning::not installable as a package; testing from the source tree"
          fi
          pip install pytest pytest-cov pytest-xdist pytest-mock hypothesis pytest-regressions "ruff==0.14.14" mypy

      - name: Lint (ruff)
        if: hashFiles('uv.lock') == ''
        run: ruff check .

      - name: Type check (mypy, non-blocking)
        if: hashFiles('uv.lock') == ''
        continue-on-error: true
        run: mypy ${{ inputs.package }}

      - name: Fast test suite
        if: hashFiles('uv.lock') == ''
        run: pytest -m "not network" -n auto
